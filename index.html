        // ==========================================
        // 5. FUNGSI SETUP OTOMATIS & UTILITAS
        // ==========================================
        async function autoSetupDatabase() {
            try {
                // JIKA MODE DEMO (Untuk keperluan Pratinjau / Preview Canvas)
                if (isDemoMode) {
                    state.allStudents = RAW_STUDENTS.map(s => ({
                        nis: s[0], nisn: s[1], nama: s[2], jk: s[3], kelas: s[4],
                        status_ujian: false, nilai: 0, selesai_pada: null
                    }));
                    hideLoading();
                    renderApp();
                    return; // Hentikan fungsi di sini
                }

                // JIKA MENGGUNAKAN FIREBASE ASLI (Saat di-deploy)
                // 1. Cek & Setup Soal
                const qSnapshot = await getDocs(query(questionsRef));
                if (qSnapshot.empty) {
                    showLoading("Menyimpan Bank Soal ke Database...");
                    const batch = writeBatch(db);
                    RAW_QUESTIONS.forEach(q => {
                        const dRef = doc(questionsRef, q.id.toString());
                        batch.set(dRef, q);
                    });
                    await batch.commit();
                }

                // 2. Cek & Setup Siswa
                const sSnapshot = await getDocs(query(studentsRef));
                if (sSnapshot.empty) {
                    showLoading("Menyimpan Data 173 Siswa ke Database...");
                    const batch = writeBatch(db);
                    RAW_STUDENTS.forEach(s => {
                        const dRef = doc(studentsRef, s[0]);
                        batch.set(dRef, {
                            nis: s[0], nisn: s[1], nama: s[2], jk: s[3], kelas: s[4],
                            status_ujian: false, nilai: 0, selesai_pada: null
                        });
                    });
                    await batch.commit();
                }

                const latestStudents = await getDocs(query(studentsRef));
                state.allStudents = latestStudents.docs.map(d => d.data());
                
                hideLoading();
                renderApp();
            } catch (error) {
                console.error("Auto Setup Error:", error);
                alert("Gagal memuat database. Periksa koneksi internet.");
                hideLoading();
            }
        }

        // Fungsi Loading UI
        const showLoading = (text = "Memuat...") => {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').classList.remove('hide');
        };
        const hideLoading = () => document.getElementById('loadingOverlay').classList.add('hide');

        // Fungsi Pengacak Soal (Anti-Nyontek)
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        // ==========================================
        // 6. RENDERING HALAMAN LOGIN
        // ==========================================
        function renderApp() {
            if (state.isAdmin) {
                renderAdminDashboard();
            } else if (state.studentData) {
                if(state.isExamFinished || state.studentData.status_ujian){
                    renderResultPage();
                } else if (!state.isConfirmed) {
                    renderConfirmationPage(); // Tampilkan halaman konfirmasi data dulu
                } else {
                    renderExamPage();
                }
            } else {
                renderLogin();
            }
        }

        // ==========================================
        async function prepareExam() {
            showLoading("Mengacak dan menyiapkan soal...");
            try {
                let rawQuestions = [];
                
                if (isDemoMode) {
                    rawQuestions = JSON.parse(JSON.stringify(RAW_QUESTIONS)); // Clone array
                } else {
                    const qSnap = await getDocs(query(questionsRef));
                    qSnap.forEach(doc => rawQuestions.push({ id: doc.id, ...doc.data() }));
                }

                // ACAK URUTAN SOAL
                rawQuestions = shuffleArray(rawQuestions);
                
                // ACAK URUTAN JAWABAN (Simpan ID mana yang benar)
                state.examQuestions = rawQuestions.map(q => {
                    let optionsWithIndex = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.ans }));
                    optionsWithIndex = shuffleArray(optionsWithIndex);
                    return { id: q.id, text: q.text, options: optionsWithIndex };
                });
                
                state.currentQuestionIndex = 0;
                state.answers = {};
                
                setTimeout(() => hideLoading(), 500);
            } catch (err) {
                hideLoading();
                alert("Terjadi kesalahan saat menyiapkan soal.");
            }
        }

        // ==========================================
        // 8. PENGIRIMAN JAWABAN & HASIL
        // ==========================================
        window.finishExam = async () => {
            const totalQ = state.examQuestions.length;
            const answeredCount = Object.keys(state.answers).length;
            
            if (answeredCount < totalQ) {
                if(!confirm(`Ada ${totalQ - answeredCount} soal yang belum dijawab. Yakin ingin mengirim sekarang?`)) return;
            } else {
                if(!confirm("Kirim jawaban sekarang? Data tidak bisa diubah setelah dikirim.")) return;
            }

            showLoading("Menyimpan hasil ujian...");

            // Hitung nilai (Otomatis)
            let benar = 0;
            state.examQuestions.forEach(q => {
                const ansIdx = state.answers[q.id];
                if (ansIdx !== undefined && q.options[ansIdx].isCorrect) benar++;
            });
            const finalScore = (benar / totalQ) * 100;

            try {
                if (isDemoMode) {
                    // Simpan di Memory (Demo)
                    const s = state.allStudents.find(x => x.nis === state.studentData.nis);
                    s.status_ujian = true; s.nilai = finalScore; s.selesai_pada = new Date().toISOString();
                    state.studentData = s;
                } else {
                    // Simpan ke Firestore
                    await updateDoc(doc(studentsRef, state.studentData.nis), {
                        status_ujian: true,
                        nilai: finalScore,
                        selesai_pada: new Date().toISOString()
                    });
                    state.studentData.status_ujian = true;
                    state.studentData.nilai = finalScore;
                }
                
                state.isExamFinished = true;
                setTimeout(() => { hideLoading(); renderApp(); }, 500);

            } catch (err) {
                hideLoading();
                alert("Gagal mengirim jawaban! Hubungi guru.");

        };

        window.fetchAdminData = () => {
            const filterKls = document.getElementById('adminFilterKelas').value;
            
            if (isDemoMode) {
                renderFilteredData(state.allStudents, filterKls);
                return;
            }

            if(state.unsubscribeAdmin) state.unsubscribeAdmin();
            state.unsubscribeAdmin = onSnapshot(query(studentsRef), (snapshot) => {
                let dataSiswa = [];
                snapshot.forEach(doc => dataSiswa.push(doc.data()));
                renderFilteredData(dataSiswa, filterKls);
            });
        };

        function renderFilteredData(data, filterKls) {
            if(filterKls !== 'ALL') data = data.filter(s => s.kelas === filterKls);
            data.sort((a, b) => {
                if(a.kelas !== b.kelas) return a.kelas.localeCompare(b.kelas);
                return a.nama.localeCompare(b.nama);
            });
            
            state.currentAdminData = data; // Simpan data ke memori agar bisa di-download Excel
            renderAdminTable(data);
        }

        window.exportToCSV = () => {
            const data = state.currentAdminData || [];
            if(data.length === 0) {
                alert("Tidak ada data untuk di-download.");
                return;
            }

            const kelasFilter = document.getElementById('adminFilterKelas').value;
            const filename = kelasFilter === 'ALL' ? 'Rekap_Nilai_Semua_Kelas_9.csv' : `Rekap_Nilai_Kelas_${kelasFilter}.csv`;

            // Membuat Header CSV
            let csvContent = "No,NIS,NISN,Nama Lengkap,Jenis Kelamin,Kelas,Status Ujian,Nilai\n";
            
            // Mengisi baris data per siswa
            data.forEach((s, index) => {
                const status = s.status_ujian ? "Selesai" : "Belum";
                const nilai = s.status_ujian ? s.nilai : "0";
                // Menggunakan ="" pada NIS agar Excel membacanya murni sebagai Teks (bukan angka/rumus)
                csvContent += `${index + 1},="${s.nis}",="${s.nisn}","${s.nama}",${s.jk},${s.kelas},${status},${nilai}\n`;
            });

            // Trigger pengunduhan file .CSV otomatis ke perangkat Bapak
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        function renderAdminTable(data) {
            const tbody = document.getElementById('adminTableBody');
            if(!tbody) return;

            let html = '';
            if(data.length === 0) {
                html = `<tr><td colspan="5" class="text-center py-10 text-slate-500 font-medium">Belum ada data siswa.</td></tr>`;
            } else {
                data.forEach((s, idx) => {
                    const statusBadge = s.status_ujian 
                        ? `<span class="bg-green-100 text-green-700 border border-green-200 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide uppercase">Selesai</span>` 
                        : `<span class="bg-slate-100 text-slate-500 border border-slate-200 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide uppercase">Belum</span>`;
                    
                    const nilaiFmt = s.status_ujian ? `<span class="font-black text-blue-600 text-lg">${s.nilai}</span>` : '<span class="text-slate-300">-</span>';
                    
                    html += `
                        <tr class="hover:bg-slate-50 transition-colors duration-150">
                            <td class="px-6 py-4 text-center font-medium">${idx + 1}</td>
                            <td class="px-6 py-4">
                                <div class="font-bold text-slate-800">${s.nama}</div>
                                <div class="text-[11px] text-slate-500 font-mono mt-0.5">NIS: ${s.nis}</div>
                            </td>
                            <td class="px-6 py-4 text-center font-bold text-slate-600">${s.kelas}</td>
                            <td class="px-6 py-4 text-center">${statusBadge}</td>
                            <td class="px-6 py-4 text-center">${nilaiFmt}</td>
                        </tr>
                    `;
                });
            }
            tbody.innerHTML = html;
        }

        window.adminLogout = async () => {
            state.isAdmin = false;
            window.location.reload();
        };

        // ==========================================
        // 10. INISIALISASI SAAT HALAMAN DIMUAT
        // ==========================================
        window.onload = async () => {
            if (!isDemoMode) {
                try { await signInAnonymously(auth); } catch(e) {}
            }
            
            // Setup DB Dummy & Render Pertama
            await autoSetupDatabase();
        };
    </script>
</body>
</html>
