        document.getElementById('btnSuntik').addEventListener('click', async () => {
            const btn = document.getElementById('btnSuntik');
            btn.disabled = true;
            btn.innerText = "Memasukkan Data... Mohon Tunggu Sebentar";
            btn.classList.replace('bg-blue-600', 'bg-gray-400');
            
            Swal.fire({ title: 'Mengeksekusi Data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // 1. Eksekusi Siswa
                const linesSiswa = rawSiswa.trim().split('\n');
                for(let line of linesSiswa) {
                    const p = line.split('|');
                    const idSiswa = 'siswa_' + p[1].trim(); 
                    await setDoc(doc(db, "users", idSiswa), {
                        nama: p[0].trim(),
                        nis: p[1].trim(),
                        jk: p[2].trim(),
                        kelas: p[3].trim(),
                        status: 'belum',
                        nilai: 0,
                        jawaban: {}
                    });
                }

                // 2. Eksekusi Soal
                const linesSoal = rawSoal.trim().split('\n');
                for(let i=0; i<linesSoal.length; i++) {
                    const p = linesSoal[i].split('|');
                    const idSoal = 'soal_pkn_' + (i+1);
                    await setDoc(doc(db, "questions", idSoal), {
                        soal: p[1].trim(),
                        a: p[2].trim(),
                        b: p[3].trim(),
                        c: p[4].trim(),
                        d: p[5].trim(),
                        jawaban: p[6].trim()
                    });
                }

                Swal.fire('BERHASIL TOTAL!', '173 Data Siswa dan 50 Soal telah masuk ke Database Bapak.', 'success');
                btn.innerText = "Selesai! Silakan buka Web Ujian Utama";
                btn.classList.replace('bg-gray-400', 'bg-green-500');

            } catch(e) {
                console.error(e);
                Swal.fire('Gagal!', 'Pastikan koneksi internet Bapak stabil.', 'error');
                btn.disabled = false;
                btn.innerText = "Gagal. Klik untuk Coba Lagi";
                btn.classList.replace('bg-gray-400', 'bg-blue-600');
            }
        });
